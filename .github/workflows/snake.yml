name: Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#9a7338&color_dots=#efeae0,#e6d3ab,#d4b17a,#b88d4f,#8c6630
            dist/snake-dark.svg?palette=github-dark&color_snake=#e2c48e&color_dots=#161b22,#3b3121,#6b5532,#a88552,#e2c48e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
